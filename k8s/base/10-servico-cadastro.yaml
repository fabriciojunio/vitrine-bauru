---
# Cadastro: contas, perfil do empreendedor e moderação da SEDECON.
# Duas réplicas porque é o serviço que coordena a saga de exclusão, e uma
# instância só significa parar a saga durante qualquer implantação.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: servico-cadastro
  namespace: vitrine-bauru
  labels:
    app.kubernetes.io/name: servico-cadastro
    app.kubernetes.io/part-of: vitrine-bauru
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: servico-cadastro
  template:
    metadata:
      labels:
        app.kubernetes.io/name: servico-cadastro
      annotations:
        # O Prometheus raspa a métrica do outbox e a de negócio direto do pod.
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8081"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: servico-cadastro
          image: ghcr.io/fabriciojunio/vitrine-bauru/servico-cadastro:1.0.0
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: PORTA
              value: "8081"
            # Um banco por serviço: o host muda, e nenhum deles enxerga a
            # tabela do vizinho nem por engano de configuração.
            - name: BANCO_URL
              value: jdbc:postgresql://banco-cadastro:5432/vitrine_cadastro
            - name: BANCO_USUARIO
              valueFrom:
                secretKeyRef: { name: vitrine-banco, key: usuario }
            - name: BANCO_SENHA
              valueFrom:
                secretKeyRef: { name: vitrine-banco, key: senha }
            - name: VITRINE_SEGREDO_JWT
              valueFrom:
                secretKeyRef: { name: vitrine-seguranca, key: segredo-jwt }
          envFrom:
            - configMapRef:
                name: vitrine-configuracao
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 512Mi
          # A partida é lenta de propósito: o Flyway roda as migrações antes de
          # o serviço aceitar tráfego. O startupProbe dá esse tempo sem que o
          # liveness derrube o pod no meio da migração.
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: temporario
              mountPath: /tmp
      volumes:
        - name: temporario
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: servico-cadastro
  namespace: vitrine-bauru
spec:
  selector:
    app.kubernetes.io/name: servico-cadastro
  ports:
    - name: http
      port: 8081
      targetPort: http

---
# Garante que uma manutenção de nó não derrube o serviço inteiro de uma vez.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: servico-cadastro
  namespace: vitrine-bauru
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: servico-cadastro
