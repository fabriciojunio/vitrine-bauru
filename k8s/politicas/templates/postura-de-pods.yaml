# Postura de segurança dos pods da Vitrine, em CEL. Impõe o que os manifestos já
# trazem: não-root, sem escalar privilégio, raiz somente leitura, imagem com tag
# fixa e teto de memória. O Kyverno estende a regra de Pod para Deployment e
# StatefulSet pelo autogen. ValidatingPolicy substitui a ClusterPolicy, que o
# Kyverno 1.19 marca como depreciada.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: vitrine-postura-de-pods
spec:
  validationActions: [{{ if eq .Values.acao "Enforce" }}Deny{{ else }}Audit{{ end }}]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchConditions:
    - name: namespace-da-vitrine
      expression: "object.metadata.namespace == 'vitrine-bauru'"
  autogen:
    podControllers:
      controllers: [deployments, statefulsets]
  variables:
    - name: conteineres
      expression: >-
        object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])
  validations:
    - expression: >-
        (has(object.spec.securityContext) && has(object.spec.securityContext.runAsNonRoot) &&
          object.spec.securityContext.runAsNonRoot == true) ||
        variables.conteineres.all(c, has(c.securityContext) &&
          has(c.securityContext.runAsNonRoot) && c.securityContext.runAsNonRoot == true)
      message: "O pod precisa declarar runAsNonRoot."
    - expression: >-
        variables.conteineres.all(c, has(c.securityContext) &&
          has(c.securityContext.allowPrivilegeEscalation) &&
          c.securityContext.allowPrivilegeEscalation == false)
      message: "allowPrivilegeEscalation precisa ser false em todo contêiner."
    - expression: >-
        variables.conteineres.all(c, has(c.securityContext) &&
          has(c.securityContext.readOnlyRootFilesystem) &&
          c.securityContext.readOnlyRootFilesystem == true)
      message: "readOnlyRootFilesystem precisa ser true em todo contêiner."
    - expression: >-
        variables.conteineres.all(c, c.image.contains('@sha256:') ||
          (c.image.split('/')[c.image.split('/').size() - 1].contains(':') &&
           !c.image.endsWith(':latest')))
      message: "A imagem precisa de tag fixa ou digest; latest não dá para reverter."
    - expression: >-
        variables.conteineres.all(c, has(c.resources) && has(c.resources.limits) &&
          'memory' in c.resources.limits)
      message: "O contêiner precisa de teto de memória."
