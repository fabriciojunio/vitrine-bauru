spring:
  application:
    name: servico-cadastro

  datasource:
    url: ${BANCO_URL:jdbc:postgresql://localhost:5433/vitrine_cadastro}
    username: ${BANCO_USUARIO:vitrine}
    password: ${BANCO_SENHA:vitrine}
    hikari:
      # Camada gratuita de banco costuma limitar conexão em algo entre 20 e 60.
      # Cinco por serviço deixa folga para o total não estourar com quatro
      # serviços mais migração rodando ao mesmo tempo.
      maximum-pool-size: ${BANCO_MAXIMO_DE_CONEXOES:5}
      connection-timeout: 10000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 30
        order_inserts: true

  flyway:
    enabled: true
    locations: classpath:db/plataforma,classpath:db/cadastro
    schemas: public

  kafka:
    bootstrap-servers: ${KAFKA_SERVIDORES:localhost:9092}

  threads:
    virtual:
      enabled: true

server:
  port: ${PORTA:8081}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

vitrine:
  mensageria:
    transporte: ${TRANSPORTE_DE_EVENTOS:kafka}
    grupo: vitrine-cadastro
  aws:
    # Só é lido quando o transporte é o sns. Endereço em branco faz o SDK
    # montar a URL a partir da região; preencher aponta para um servidor
    # local. Chave em branco usa a credencial do papel da máquina, que é o
    # que se quer em produção: sem segredo em variável de ambiente.
    regiao: ${AWS_REGIAO:sa-east-1}
    endereco: ${AWS_ENDERECO:}
    chave: ${AWS_CHAVE:}
    segredo: ${AWS_SEGREDO:}
  seguranca:
    segredo: ${VITRINE_SEGREDO_JWT:segredo-de-desenvolvimento-com-mais-de-32-bytes}
    duracao-do-acesso: 15m
    duracao-do-refresh: 7d
    origens-permitidas: ${ORIGENS_PERMITIDAS:http://localhost:5173}
  limite:
    ativo: ${LIMITE_ATIVO:true}
    regras:
      # Login: cinco tentativas por minuto por endereço. O bloqueio de conta
      # cuida do resto; isto só evita que alguém tente mil senhas por segundo.
      - padrao: /api/cadastro/auth/login
        capacidade: 5
        janela: 1m
      # Cadastro: dez por hora. Passar disso não é empreendedor se cadastrando.
      - padrao: /api/cadastro/empreendedores
        capacidade: 10
        janela: 1h
      - padrao: /api/cadastro/auth/renovar
        capacidade: 30
        janela: 1m
  demo:
    ativo: ${DEMO_ATIVO:false}
    senha: ${DEMO_SENHA:demonstracao2026}
  brasilapi:
    ativa: ${BRASILAPI_ATIVA:true}
    url: https://brasilapi.com.br/api

resilience4j:
  circuitbreaker:
    instances:
      brasilapi:
        # Abre depois de metade das últimas dez chamadas falharem, e volta a
        # tentar em meio minuto. Números pequenos de propósito: a consulta é
        # opcional, então insistir custa mais que desistir.
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      servico: cadastro

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    br.com.vitrinebauru: INFO
  pattern:
    # A correlação no padrão do log é o que permite seguir um cadastro pelos
    # quatro serviços sem cruzar horário a olho.
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlacao:-}] %logger{36} - %msg%n"
