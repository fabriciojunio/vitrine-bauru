spring:
  application:
    name: servico-notificacoes

  datasource:
    url: ${BANCO_URL:jdbc:postgresql://localhost:5433/vitrine_notificacoes}
    username: ${BANCO_USUARIO:vitrine}
    password: ${BANCO_SENHA:vitrine}
    hikari:
      # Camada gratuita de banco costuma limitar conexão em algo entre 20 e 60.
      # Cinco por serviço deixa folga para o total não estourar com quatro
      # serviços mais migração rodando ao mesmo tempo.
      maximum-pool-size: ${BANCO_MAXIMO_DE_CONEXOES:5}
      connection-timeout: 10000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 30
        order_inserts: true

  flyway:
    enabled: true
    locations: classpath:db/plataforma,classpath:db/notificacoes
    schemas: public

  kafka:
    bootstrap-servers: ${KAFKA_SERVIDORES:localhost:9092}

  threads:
    virtual:
      enabled: true

server:
  port: ${PORTA:8084}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

vitrine:
  nome: ${VITRINE_NOME:Vitrine Bauru}
  mensageria:
    transporte: ${TRANSPORTE_DE_EVENTOS:kafka}
    grupo: vitrine-notificacoes
  seguranca:
    segredo: ${VITRINE_SEGREDO_JWT:segredo-de-desenvolvimento-com-mais-de-32-bytes}
    duracao-do-acesso: 15m
    duracao-do-refresh: 7d
    origens-permitidas: ${ORIGENS_PERMITIDAS:http://localhost:5173}
  limite:
    ativo: ${LIMITE_ATIVO:true}
    regras: []
  email:
    # Padrão desligado: sem isto ligado, o serviço escreve no log em vez de
    # mandar e-mail de verdade, o que é o certo em desenvolvimento e na
    # demonstração pública, cheia de endereço fictício.
    ativo: ${EMAIL_ATIVO:false}
    chave: ${RESEND_CHAVE:}
    remetente: ${EMAIL_REMETENTE:Vitrine Bauru <nao-responda@vitrinebauru.com.br>}
    intervalo-ms: 5000
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      servico: notificacoes

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    br.com.vitrinebauru: INFO
  pattern:
    # A correlação no padrão do log é o que permite seguir um cadastro pelos
    # quatro serviços sem cruzar horário a olho.
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlacao:-}] %logger{36} - %msg%n"
