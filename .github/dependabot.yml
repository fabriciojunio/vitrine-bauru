version: 2
updates:
  # Versão nova só é proposta depois de 7 dias, quando um pacote comprometido
  # costuma já ter sido retirado do repositório público.
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    # Menor e correção vão num PR só por ecossistema. Um PR por pacote estourou
    # o limite diário de deploys da Vercel em 05/11/2026.
    groups:
      menores-e-correcoes:
        update-types: ["minor", "patch"]
    ignore:
      # Versão principal muda API e entra como migração planejada e testada. Correção de
      # segurança não passa por aqui e continua vindo.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # A linha 2025.1 do Spring Cloud é do Spring Boot 4; sobe junto com ele.
      - dependency-name: "org.springframework.cloud:spring-cloud-dependencies"
        versions: [">=2025.1"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    # Menor e correção vão num PR só por ecossistema. Um PR por pacote estourou
    # o limite diário de deploys da Vercel em 05/11/2026.
    groups:
      menores-e-correcoes:
        update-types: ["minor", "patch"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
    ignore:
      # Versão principal muda API e entra como migração planejada e testada. Correção de
      # segurança não passa por aqui e continua vindo.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    # Menor e correção vão num PR só por ecossistema. Um PR por pacote estourou
    # o limite diário de deploys da Vercel em 05/11/2026.
    groups:
      menores-e-correcoes:
        update-types: ["minor", "patch"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
    ignore:
      # Versão principal muda API e entra como migração planejada e testada. Correção de
      # segurança não passa por aqui e continua vindo.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # A etiqueta traz o JDK junto, e a troca para um JDK que não é LTS vinha como menor.
      - dependency-name: "maven"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Menor e correção vão num PR só por ecossistema. Um PR por pacote estourou
    # o limite diário de deploys da Vercel em 05/11/2026.
    groups:
      menores-e-correcoes:
        update-types: ["minor", "patch"]
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(deps)"
