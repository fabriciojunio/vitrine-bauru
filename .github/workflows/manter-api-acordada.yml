# Mantém a API acordada o tempo todo, para ninguém esperar o serviço subir.
#
# O plano gratuito do Render desliga o serviço depois de quinze minutos sem
# receber requisição, e a primeira visita depois disso espera o serviço subir.
# Medimos 91 segundos numa chamada real.
#
# Roda o dia inteiro, de propósito: a decisão foi nunca deixar dormir, para
# quem abrir o endereço nunca esperar.
#
# ATENÇÃO, medido em 01/09/2026: **este fluxo sozinho não dá conta.** Pedimos
# execução a cada dez minutos e o GitHub entregou quatro em dezenove horas,
# espaçadas de cinco em cinco horas. Agendamento na camada gratuita é promessa,
# não garantia, e o serviço dormiu no intervalo. Quem mantém acordado de
# verdade é um monitor externo, e este fluxo ficou como rede de segurança para
# quando o monitor externo falhar. Ver docs/IMPLANTACAO.md.
#
# A conta que isso exige: o ping consome as mesmas horas de instância que ele
# protege. A cota gratuita é de 750 horas por mês e um mês de 31 dias tem 744,
# então 24 horas por dia cabe, com seis horas de margem e nada mais. E a cota é
# da conta inteira: enquanto este fluxo rodar, **não dá para ter um segundo
# serviço web gratuito no Render**, porque os dois somados estouram o limite e
# ambos param até virar o mês.
#
# Se um dia precisar de outro serviço gratuito, reduza a janela aqui para o
# horário útil (cron "*/10 10-23,0-2 * * *" dá 527 horas) ou assine o plano
# pago, que custa cerca de sete dólares por mês e dispensa este fluxo.

name: Manter a API acordada

on:
  schedule:
    # A cada dez minutos, sem parar. A janela do Render é de quinze minutos, e
    # dez deixa margem para o atraso normal do agendador do GitHub.
    - cron: "*/10 * * * *"
  workflow_dispatch:

# Uma execução por vez: se uma demorar, a seguinte não empilha.
concurrency:
  group: manter-api-acordada
  cancel-in-progress: false

jobs:
  acordar:
    runs-on: ubuntu-latest
    # Folga sobre os 240 segundos do curl, para o passo não ser cortado
    # justamente quando o serviço está subindo depois de horas parado.
    timeout-minutes: 6
    steps:
      - name: Acordar o serviço
        env:
          # Sem segredo configurado, o passo não falha: só avisa e sai. Assim
          # o fluxo pode existir no repositório antes de alguém publicar a API.
          DEMO_URL: ${{ secrets.DEMO_URL }}
        run: |
          if [ -z "$DEMO_URL" ]; then
            echo "O segredo DEMO_URL não está configurado. Nada a fazer."
            exit 0
          fi

          # O caminho é o de saúde de propósito. O robots.txt não serve: com o
          # serviço dormindo, o Render responde a esse caminho sozinho e a
          # requisição nunca chega na aplicação, então não acorda nada.
          # Duzentos e quarenta segundos, e não cento e vinte: quando o
          # agendamento falha e o serviço dorme por horas, acordar passa
          # dos dois minutos, e o limite curto abortava a chamada bem no
          # meio da subida. O "|| true" substitui o echo de reserva: o
          # próprio curl já escreve 000 quando falha, e os dois juntos
          # faziam o log sair como "Resposta 000000".
          inicio=$(date +%s)
          codigo=$(curl -s -o /dev/null -w "%{http_code}" --max-time 240 \
            "$DEMO_URL/actuator/health" || true)
          fim=$(date +%s)
          codigo=${codigo:-000}

          echo "Resposta $codigo em $((fim - inicio))s"

          # Não falha por serviço fora do ar: este fluxo é conveniência, e
          # e-mail de falha a cada dez minutos vira ruído que ninguém lê. Quem
          # cobra a saúde da API é o teste de ponta a ponta do CI.
          if [ "$codigo" != "200" ]; then
            echo "::warning::A API respondeu $codigo. Se repetir, confira o painel do Render."
          fi
