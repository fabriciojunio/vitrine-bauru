---
# As políticas: o Flux instala o chart Kyverno a partir do mesmo repositório, em
# Enforce. Depende do Kyverno já estar no cluster; a instalação dele fica a
# cargo do operador da plataforma, não deste repositório.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vitrine-politicas
  namespace: flux-system
spec:
  interval: 1h
  chart:
    spec:
      chart: k8s/politicas
      sourceRef:
        kind: GitRepository
        name: vitrine-bauru
        namespace: flux-system
  values:
    acao: Enforce
